name: Commerce PostgreSQL concurrency
on:
  push:
    branches:
      - feature/artwork-commerce-payments-off
    paths:
      - .github/workflows/commerce-postgres.yml
      - web/tests/commerce-postgres/**
      - web/supabase/artwork-commerce.sql
      - web/supabase/migrations/**
permissions:
  contents: read
concurrency:
  group: commerce-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: commerce_ci_only
          POSTGRES_DB: mostra_commerce_ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mostra_commerce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install isolated test dependencies
        run: npm ci --prefix web/tests/commerce-postgres --ignore-scripts --no-audit --no-fund
      - name: Run real PostgreSQL concurrency tests
        run: npm test --prefix web/tests/commerce-postgres
        env:
          COMMERCE_EPHEMERAL_POSTGRES: 'true'
